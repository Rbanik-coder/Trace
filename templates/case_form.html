{% extends 'base.html' %}{% block heading %}Register a case{% endblock %}{% block content %}<div class="page-intro">Create a structured incident record. Add evidence and identifiers to enable cross-case discovery.</div><form method="post" class="panel form-grid"><label class="wide">Incident title<input name="title" required placeholder="e.g. UPI collect request scam"></label><label>Victim / complainant<input name="victim" placeholder="Full name or case alias"></label><label>Incident category<select name="category"><option>UPI Fraud</option><option>Phishing</option><option>Impersonation</option><option>Investment Fraud</option><option>Identity Theft</option><option>Other</option></select></label><label>Incident date<input type="date" name="incident_date"></label><label>Reported loss (₹)<input type="number" min="0" step="0.01" name="loss" placeholder="0"></label><label class="wide">Transaction reference<input name="transaction_ref" placeholder="UTR / TXN / reference number"></label><label>Latitude (optional)<input name="latitude" type="number" step="any" min="-90" max="90" placeholder="28.6139"></label><label>Longitude (optional)<input name="longitude" type="number" step="any" min="-180" max="180" placeholder="77.2090"></label><label>Location source<select name="location_source"><option>Not supplied</option><option>Complainant supplied</option><option>IP-derived (unverified)</option><option>Cell-tower-derived (unverified)</option><option>Witness / CCTV (reviewed)</option></select></label><label>Accuracy radius (metres)<input name="accuracy_m" type="number" min="0" step="1" placeholder="e.g. 500"></label><label class="wide">Jurisdiction / district<input name="jurisdiction" placeholder="e.g. New Delhi district"></label><label class="wide">Incident description<textarea name="description" rows="5" placeholder="What happened? Include any known phone numbers, UPI IDs, URLs or account references."></textarea></label><div class="wide form-actions"><a class="btn btn-ghost" href="/">Cancel</a><button class="btn btn-primary">Create case →</button></div></form>{% endblock %}
